<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Info — Martin Nayeri</title>
  <link rel="apple-touch-icon" sizes="180x180" href="favicon_io/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon_io/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon_io/favicon-16x16.png">
  <link rel="manifest" href="favicon_io/site.webmanifest">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html {
      background: #818787;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif;
      font-size: 13px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body { padding: 28px 36px 80px; }

    a { color: inherit; text-decoration: none; }

    /* ─── Header ─── */
    .hd {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 44px;
    }
    .hd-name { font-weight: 400; }
    .hd-back {
      font-size: 12px;
      color: rgba(255,255,255,.5);
      transition: color .12s;
    }
    .hd-back:hover { color: #fff; }

    /* ─── Two-column grid ─── */
    .info-grid {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 0 80px;
    }

    @keyframes line-in {
      from { transform: scaleX(0); }
      to   { transform: scaleX(1); }
    }
    @keyframes fade-up {
      from { opacity: 0; transform: translateY(-5px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .hd { animation: fade-up 0.18s ease both; }

    /* Top rule above each column — animated */
    .info-grid > * {
      position: relative;
      padding-top: 20px;
    }
    .info-grid > *::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 1px;
      background: rgba(255,255,255,.35);
      transform-origin: left;
      animation: line-in 0.25s ease both;
    }
    .bio::before        { animation-delay: 0.08s; }
    .info-right::before { animation-delay: 0.13s; }

    /* Content fades in after lines */
    .bio > *:nth-child(1) { animation: fade-up 0.18s ease 0.26s both; }
    .bio > *:nth-child(2) { animation: fade-up 0.18s ease 0.31s both; }
    .bio > *:nth-child(3) { animation: fade-up 0.18s ease 0.36s both; }

    .info-section:nth-child(1) { animation: fade-up 0.18s ease 0.26s both; }
    .info-section:nth-child(2) { animation: fade-up 0.18s ease 0.31s both; }
    .info-section:nth-child(3) { animation: fade-up 0.18s ease 0.36s both; }
    .info-section:nth-child(4) { animation: fade-up 0.18s ease 0.41s both; }

    /* ─── Left: bio ─── */
    .bio p {
      font-size: 13px;
      line-height: 1.45;
      color: rgba(255,255,255,.85);
    }
    .bio p + p { margin-top: 12px; }

    .bio a {
      text-decoration: underline;
      text-decoration-color: rgba(255,255,255,.3);
      text-underline-offset: 3px;
      transition: text-decoration-color .12s;
    }
    .bio a:hover { text-decoration-color: rgba(255,255,255,.8); }
    .bio a::after {
      content: '↗';
      font-size: 0.75em;
      display: inline-block;
      margin-left: 3px;
    }

    .bio .honors {
      margin-top: 32px;
    }

    /* ─── Right: sections ─── */

    .info-section { margin-bottom: 32px; }
    .info-section:last-child { margin-bottom: 0; }

    .section-label {
      font-size: 10px;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: rgba(255,255,255,.35);
      margin-bottom: 10px;
    }

    .info-list {
      list-style: none;
      line-height: 1.4;
    }

    .info-list li { font-size: 13px; color: rgba(255,255,255,.75); }

    .info-list a {
      color: rgba(255,255,255,.75);
      transition: color .12s;
    }
    .info-list a:hover { color: #fff; }
    .info-list a::after {
      content: '↗';
      font-size: 0.75em;
      display: inline-block;
      margin-left: 3px;
      opacity: 0.5;
      transition: opacity .12s;
    }
    .info-list a:hover::after { opacity: 1; }

    /* ─── Responsive ─── */
    @media (max-width: 640px) {
      body { padding: 20px 18px 60px; }
      .hd { flex-direction: column; gap: 6px; }
      .info-grid {
        grid-template-columns: 1fr;
        gap: 40px 0;
      }
    }
  </style>
</head>
<body>

<header class="hd">
  <a href="index.html" class="hd-name">Martin Nayeri</a>
  <a href="index.html" class="hd-back">← work</a>
</header>

<div class="info-grid">
  <!-- Left: bio -->
  <div class="bio" id="bio"></div>

  <!-- Right: sections -->
  <div class="info-right" id="info-right"></div>
</div>

<script src="about-data.js"></script>
<script>
function esc(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// Bio + honors
const honorsHtml = ABOUT.honors && ABOUT.honors.length ? `
  <div class="honors">
    <p class="section-label">Honors</p>
    <ul class="info-list">
      ${ABOUT.honors.map(item =>
        item.href
          ? `<li><a href="${esc(item.href)}" target="_blank" rel="noopener">${esc(item.text)}</a></li>`
          : `<li>${esc(item.text)}</li>`
      ).join('')}
    </ul>
  </div>` : '';

document.getElementById('bio').innerHTML =
  ABOUT.bio.map(p => `<p>${p}</p>`).join('') + honorsHtml;

// Sections
document.getElementById('info-right').innerHTML =
  ABOUT.sections.map(s => `
    <div class="info-section">
      <p class="section-label">${esc(s.label)}</p>
      <ul class="info-list">
        ${s.items.map(item =>
          item.href
            ? `<li><a href="${esc(item.href)}" target="_blank" rel="noopener">${esc(item.text)}</a></li>`
            : `<li>${esc(item.text)}</li>`
        ).join('')}
      </ul>
    </div>
  `).join('');
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Info — Martin Nayeri</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html {
      background: #818787;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif;
      font-size: 13px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body { padding: 28px 36px 80px; }

    a { color: inherit; text-decoration: none; }

    /* ─── Header ─── */
    .hd {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 44px;
    }
    .hd-name { font-weight: 400; }
    .hd-back {
      font-size: 12px;
      color: rgba(255,255,255,.5);
      transition: color .12s;
    }
    .hd-back:hover { color: #fff; }

    /* ─── Two-column grid ─── */
    .info-grid {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 0 80px;
    }

    /* Top rule above each column */
    .info-grid > * {
      border-top: 1px solid rgba(255,255,255,.35);
      padding-top: 20px;
    }

    /* ─── Left: bio ─── */
    .bio p {
      font-size: 13px;
      line-height: 1.65;
      color: rgba(255,255,255,.85);
    }
    .bio p + p { margin-top: 16px; }

    .bio .honors {
      margin-top: 32px;
    }

    /* ─── Right: sections ─── */
    .info-right { padding-top: 20px; }

    .info-section { margin-bottom: 32px; }
    .info-section:last-child { margin-bottom: 0; }

    .section-label {
      font-size: 10px;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: rgba(255,255,255,.35);
      margin-bottom: 10px;
    }

    .info-list {
      list-style: none;
      line-height: 1.9;
    }

    .info-list li { font-size: 13px; color: rgba(255,255,255,.75); }

    .info-list a {
      color: rgba(255,255,255,.75);
      transition: color .12s;
    }
    .info-list a:hover { color: #fff; }

    /* ─── Responsive ─── */
    @media (max-width: 640px) {
      body { padding: 20px 18px 60px; }
      .hd { flex-direction: column; gap: 6px; }
      .info-grid {
        grid-template-columns: 1fr;
        gap: 40px 0;
      }
    }
  </style>
</head>
<body>

<header class="hd">
  <a href="index.html" class="hd-name">Martin Nayeri</a>
  <a href="index.html" class="hd-back">← work</a>
</header>

<div class="info-grid">
  <!-- Left: bio -->
  <div class="bio" id="bio"></div>

  <!-- Right: sections -->
  <div class="info-right" id="info-right"></div>
</div>

<script src="about-data.js"></script>
<script>
function esc(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// Bio + honors
const honorsHtml = ABOUT.honors && ABOUT.honors.length ? `
  <div class="honors">
    <p class="section-label">Honors</p>
    <ul class="info-list">
      ${ABOUT.honors.map(item =>
        item.href
          ? `<li><a href="${esc(item.href)}">${esc(item.text)}</a></li>`
          : `<li>${esc(item.text)}</li>`
      ).join('')}
    </ul>
  </div>` : '';

document.getElementById('bio').innerHTML =
  ABOUT.bio.map(p => `<p>${esc(p)}</p>`).join('') + honorsHtml;

// Sections
document.getElementById('info-right').innerHTML =
  ABOUT.sections.map(s => `
    <div class="info-section">
      <p class="section-label">${esc(s.label)}</p>
      <ul class="info-list">
        ${s.items.map(item =>
          item.href
            ? `<li><a href="${esc(item.href)}">${esc(item.text)}</a></li>`
            : `<li>${esc(item.text)}</li>`
        ).join('')}
      </ul>
    </div>
  `).join('');
</script>
</body>
</html>
